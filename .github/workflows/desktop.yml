name: Escritorio

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # para adjuntar los archivos a la release

defaults:
  run:
    working-directory: desktop

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust estable
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustc --version

      - name: Dependencias (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libudev-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev

      - name: Pruebas
        run: cargo test --release

      - name: Compilar y empaquetar (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          mkdir -p dist
          tar -czf dist/r2control-linux-x86_64.tar.gz -C target/release r2control

      - name: Compilar y empaquetar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/r2control.exe -DestinationPath dist/r2control-windows-x86_64.zip

      - name: Compilar y empaquetar (macOS, universal)
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ github.event.release.tag_name || '0.0.0' }}
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output r2control-universal target/aarch64-apple-darwin/release/r2control target/x86_64-apple-darwin/release/r2control
          mkdir -p dist
          packaging/macos/bundle.sh r2control-universal dist "${VERSION#v}"
          (cd dist && ditto -c -k --keepParent R2Control.app r2control-macos-universal.zip && rm -rf R2Control.app)

      - uses: actions/upload-artifact@v4
        with:
          name: r2control-${{ runner.os }}
          path: desktop/dist/*

      - name: Adjuntar a la release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber --repo "${{ github.repository }}"
