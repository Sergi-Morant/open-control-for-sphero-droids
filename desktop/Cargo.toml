[package]
name = "open-control-for-sphero-droids"
version = "0.1.0"
edition = "2024"
description = "Control no oficial de los droides Sphero desde macOS, Linux y Windows"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
btleplug = "0.13.5"
eframe = "0.37.0"
egui = "0.37.0"
fastrand = "2.5.0"
futures = "0.3.34"
gilrs = "0.11.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = "1.29.0"

[profile.release]
strip = true
